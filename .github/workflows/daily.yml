name: 每日自动更新

on:
  schedule:
      - cron: '7 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取时政内容
        run: node scripts/fetch-news.js

      - name: 发布当日内容
        run: node scripts/daily-push.js

      - name: 提交回仓库
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "auto: $(date +%F)" || echo "无变更"
          git push
