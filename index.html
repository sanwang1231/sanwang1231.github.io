<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时政要闻 · 每日更新</title>
<style>
  :root{
    --ink:#1a1a1e; --paper:#f4f1ea; --card:#ffffff;
    --red:#9a1f24; --red-deep:#6e1417; --red-soft:#c8433a;
    --gold:#c9a24b; --line:#e6e0d4; --muted:#8a8578;
    --shadow:0 2px 4px rgba(26,26,30,.04),0 12px 32px rgba(26,26,30,.06);
    --shadow-h:0 6px 12px rgba(154,31,36,.10),0 24px 56px rgba(154,31,36,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Source Han Sans","Noto Sans CJK SC",system-ui,sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;
  }
  .hero{
    position:relative;overflow:hidden;color:#fff;
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(201,162,75,.35), transparent 60%),
      linear-gradient(135deg,var(--red-deep) 0%,var(--red) 55%,#7d1a1d 100%);
    padding:54px 24px 64px;
  }
  .hero::before{
    content:"";position:absolute;inset:0;opacity:.06;
    background-image:radial-gradient(#fff 1px,transparent 1px);background-size:22px 22px;
  }
  .hero-inner{max-width:1080px;margin:0 auto;position:relative;z-index:1}
  .kicker{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;letter-spacing:.28em;text-transform:uppercase;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
    padding:6px 16px;border-radius:999px;margin-bottom:18px;backdrop-filter:blur(4px);
  }
  .kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 0 0 rgba(201,162,75,.7);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,162,75,.6)}70%{box-shadow:0 0 0 10px rgba(201,162,75,0)}100%{box-shadow:0 0 0 0 rgba(201,162,75,0)}}
  .hero h1{font-size:clamp(30px,5vw,48px);font-weight:800;letter-spacing:.04em;line-height:1.2}
  .hero .sub{margin-top:12px;font-size:16px;opacity:.9;max-width:620px}
  .hero .stamp{margin-top:26px;font-size:14px;opacity:.82;display:flex;gap:18px;flex-wrap:wrap}
  .hero .stamp b{color:var(--gold);font-weight:700}
  .wrap{max-width:1080px;margin:-34px auto 60px;padding:0 24px;position:relative;z-index:2}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:34px}
  .stat{
    background:var(--card);border-radius:16px;padding:22px 20px;box-shadow:var(--shadow);
    border-top:3px solid var(--red);position:relative;overflow:hidden;
    transition:transform .25s ease,box-shadow .25s ease;
  }
  .stat:hover{transform:translateY(-4px);box-shadow:var(--shadow-h)}
  .stat .num{font-size:40px;font-weight:800;color:var(--red);line-height:1;font-variant-numeric:tabular-nums}
  .stat .lab{margin-top:8px;font-size:13px;color:var(--muted);letter-spacing:.04em}
  .stat .glow{position:absolute;right:-18px;top:-18px;width:74px;height:74px;border-radius:50%;
    background:radial-gradient(circle,rgba(154,31,36,.10),transparent 70%)}
  .sec-title{display:flex;align-items:baseline;gap:12px;margin:0 2px 18px}
  .sec-title h2{font-size:22px;font-weight:800}
  .sec-title .bar{width:6px;height:22px;border-radius:3px;
    background:linear-gradient(var(--red),var(--gold));align-self:center}
  .sec-title .hint{font-size:13px;color:var(--muted)}
  .panel{background:var(--card);border-radius:18px;padding:24px 26px;box-shadow:var(--shadow);margin-bottom:34px}
  .chart{display:flex;flex-direction:column;gap:16px;margin-top:6px}
  .row{display:grid;grid-template-columns:104px 1fr 44px;align-items:center;gap:14px}
  .row .name{font-size:14px;font-weight:600;color:var(--ink);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .track{height:14px;background:#efeadd;border-radius:999px;overflow:hidden}
  .row .fill{height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--red),var(--red-soft) 70%,var(--gold));
    transition:width 1.1s cubic-bezier(.22,1,.36,1)}
  .row .val{font-size:15px;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}
  .filters{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
  .chip{
    font-size:14px;padding:8px 18px;border-radius:999px;cursor:pointer;user-select:none;
    background:#fff;border:1px solid var(--line);color:var(--ink);transition:all .2s ease;font-weight:600;
  }
  .chip:hover{border-color:var(--red);color:var(--red)}
  .chip.on{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 6px 16px rgba(154,31,36,.28)}
  .chip .cnt{opacity:.7;font-size:12px;margin-left:4px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
  .news{
    background:var(--card);border-radius:18px;padding:24px;box-shadow:var(--shadow);
    border-left:4px solid var(--red);display:flex;gap:20px;
    transition:transform .25s ease,box-shadow .25s ease;opacity:0;transform:translateY(16px);
    animation:rise .5s ease forwards;
  }
  .news:hover{transform:translateY(-5px);box-shadow:var(--shadow-h)}
  @keyframes rise{to{opacity:1;transform:none}}
  .news .datebox{flex:0 0 64px;text-align:center;align-self:flex-start}
  .news .datebox .d{font-size:28px;font-weight:800;color:var(--red);line-height:1}
  .news .datebox .ym{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.03em}
  .news .catbadge{display:inline-block;font-size:12px;font-weight:700;color:var(--red-deep);
    background:rgba(154,31,36,.09);border:1px solid rgba(154,31,36,.18);
    padding:2px 10px;border-radius:6px;margin-bottom:8px;letter-spacing:.05em}
  .news h3{font-size:18px;font-weight:800;line-height:1.45;margin-bottom:8px}
  .news p{font-size:14px;color:#4d4a44;margin-bottom:12px}
  .news .tags{display:flex;flex-wrap:wrap;gap:7px}
  .tag{font-size:12px;color:var(--muted);background:#f3f0e8;border-radius:999px;padding:3px 11px}
  .tag.t0{color:var(--red);background:rgba(154,31,36,.07)}
  .state{padding:60px;text-align:center;color:var(--muted);font-size:15px}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);
    border-top-color:var(--red);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:10px}
  @keyframes spin{to{transform:rotate(360deg)}}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:24px;border-top:1px solid var(--line)}
  @media(max-width:760px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .grid{grid-template-columns:1fr}
    .row{grid-template-columns:84px 1fr 36px}
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <span class="kicker"><span class="dot"></span>每日自动更新 · DAILY BRIEFING</span>
      <h1>时政要闻</h1>
      <p class="sub">日拱一卒，功不唐捐。每天定时从权威源抓取并推送一条时政要点，长期累积成你的随身时政库。</p>
      <div class="stamp">
        <span>今天是 <b id="today"></b></span>
        <span>累计在库 <b id="s-total2">0</b> 条</span>
        <span>最近更新 <b id="s-last"></b></span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="stats">
      <div class="stat"><span class="glow"></span><div class="num" id="s-total">0</div><div class="lab">在库内容总数</div></div>
      <div class="stat"><span class="glow"></span><div class="num" id="s-cat">0</div><div class="lab">覆盖分类</div></div>
      <div class="stat"><span class="glow"></span><div class="num" id="s-month">0</div><div class="lab">本月更新</div></div>
      <div class="stat"><span class="glow"></span><div class="num" id="s-days">0</div><div class="lab">连续更新（天）</div></div>
    </section>

    <div class="sec-title"><span class="bar"></span><h2>分类分布</h2><span class="hint">各类别内容条数一览</span></div>
    <section class="panel"><div class="chart" id="chart"></div></section>

    <div class="sec-title"><span class="bar"></span><h2>内容列表</h2><span class="hint">按日期倒序，点击分类筛选</span></div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="list">
      <div class="state" style="grid-column:1/-1"><span class="spin"></span>正在读取数据…</div>
    </div>
  </main>

  <footer>Powered by GitHub Actions · 数据源 data/materials.json</footer>

<script>
(function(){
  var DATA_URL = './data/materials.json';
  function fmtToday(){
    var d=new Date(), w=['日','一','二','三','四','五','六'];
    return d.getFullYear()+String(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+w[d.getDay()];
  }
  function pad(n){return ('0'+n).slice(-2);}
  function countUp(el,to){
    var start=0, dur=900, t0=null;
    function step(ts){
      if(!t0)t0=ts;
      var p=Math.min((ts-t0)/dur,1);
      el.textContent=Math.floor(p*(to-start)+start);
      if(p<1)requestAnimationFrame(step);else el.textContent=to;
    }
    requestAnimationFrame(step);
  }
  function normalize(list){
    return list.filter(function(x){return x&&x.title;}).map(function(x){
      var date=(x.date||'').slice(0,10);
      var parts=date.split('-');
      return {title:x.title, summary:x.summary||'', tags:x.tags||[],
        category:x.category||'未分类', date:date,
        y:parts[0]||'', m:parts[1]||'', d:parts[2]||''};
    });
  }
  function renderAll(raw){
    var data=normalize(raw).sort(function(a,b){return b.date<a.date?-1:1;});
    var today=new Date(), ym=today.getFullYear()+'-'+pad(today.getMonth()+1);
    var cats={};
    data.forEach(function(i){cats[i.category]=(cats[i.category]||0)+1;});
    var monthCnt=data.filter(function(i){return i.date.slice(0,7)===ym;}).length;
    var dateSet={};
    data.forEach(function(i){if(i.date)dateSet[i.date]=1;});
    var cont=0, cur=new Date(today.getFullYear(),today.getMonth(),today.getDate());
    for(var k=0;k<3650;k++){
      var s=cur.getFullYear()+'-'+pad(cur.getMonth()+1)+'-'+pad(cur.getDate());
      if(dateSet[s]){cont++;cur.setDate(cur.getDate()-1);}
      else if(k===0){cur.setDate(cur.getDate()-1);continue;}
      else break;
    }
    countUp(document.getElementById('s-total'),data.length);
    countUp(document.getElementById('s-cat'),Object.keys(cats).length);
    countUp(document.getElementById('s-month'),monthCnt);
    countUp(document.getElementById('s-days'),cont);
    document.getElementById('s-total2').textContent=data.length;
    document.getElementById('s-last').textContent=(data[0]?data[0].date:'-');

    var chart=document.getElementById('chart');chart.innerHTML='';
    var max=1; Object.keys(cats).forEach(function(k){if(cats[k]>max)max=cats[k];});
    var names=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a];});
    names.forEach(function(name,idx){
      var row=document.createElement('div');row.className='row';
      row.innerHTML='<div class="name">'+name+'</div><div class="track"><div class="fill"></div></div><div class="val">'+cats[name]+'</div>';
      chart.appendChild(row);
      var f=row.querySelector('.fill');
      setTimeout(function(){f.style.width=(cats[name]/max*100)+'%';}, 80+idx*90);
    });

    var filters=document.getElementById('filters');filters.innerHTML='';
    var fnames=['全部'].concat(names);
    fnames.forEach(function(name,idx){
      var cnt=name==='全部'?data.length:cats[name];
      var c=document.createElement('div');c.className='chip'+(idx===0?' on':'');
      c.innerHTML=name+'<span class="cnt">'+cnt+'</span>';
      c.onclick=function(){
        Array.prototype.forEach.call(filters.children,function(x){x.classList.remove('on');});
        c.classList.add('on');
        renderList(name==='全部'?data:data.filter(function(i){return i.category===name;}));
      };
      filters.appendChild(c);
    });
    renderList(data);
  }
  function renderList(data){
    var list=document.getElementById('list');list.innerHTML='';
    if(!data.length){list.innerHTML='<div class="state" style="grid-column:1/-1">暂无内容</div>';return;}
    data.forEach(function(i,idx){
      var el=document.createElement('article');el.className='news';
      el.style.animationDelay=(idx%12*0.05)+'s';
      var tags=i.tags.map(function(t,ti){return '<span class="tag'+(ti===0?' t0':'')+'">'+t+'</span>';}).join('');
      el.innerHTML=
        '<div class="datebox"><div class="d">'+(i.d||'--')+'</div><div class="ym">'+(i.y||'')+'.'+(i.m||'')+'</div></div>'+
        '<div style="flex:1;min-width:0">'+
          '<span class="catbadge">'+i.category+'</span>'+
          '<h3>'+i.title+'</h3>'+
          (i.summary?'<p>'+i.summary+'</p>':'')+
          (tags?'<div class="tags">'+tags+'</div>':'')+
        '</div>';
      list.appendChild(el);
    });
  }
  document.getElementById('today').textContent=fmtToday();
  fetch(DATA_URL,{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
  }).then(renderAll).catch(function(e){
    document.getElementById('list').innerHTML=
      '<div class="state" style="grid-column:1/-1">读取 materials.json 失败：'+e.message+
      '<br>请确认 data/materials.json 路径正确且为合法 JSON。</div>';
  });
})();
</script>
</body>
</html>
